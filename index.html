<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סופי - SOFY AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rubik', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: radial-gradient(circle at left, #001f3f 0%, #00cdca 100%);
      color: white;
      padding: 20px;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 10px;
      opacity: 0.9;
    }

    .logo-text {
      font-size: 2.5rem;
      font-weight: 700;
      color: white;
    }

    .chat-box {
      width: 100%;
      max-width: 550px;
      flex-grow: 1;
      margin: 15px 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 10px;
    }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 20px;
      font-size: 1.05rem;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user-message {
      align-self: flex-end;
      background: rgba(255, 255, 255, 0.25);
      border-bottom-left-radius: 4px;
      color: white;
    }

    .bot-message {
      align-self: flex-start;
      background: rgba(0, 205, 202, 0.35);
      border-bottom-right-radius: 4px;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .input-container {
      width: 100%;
      max-width: 550px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .chat-input {
      width: 100%;
      padding: 18px 25px;
      padding-left: 65px;
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: white;
      font-size: 1.1rem;
      outline: none;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
    }

    .chat-input::placeholder {
      color: rgba(255, 255, 255, 0.85);
    }

    .send-btn {
      position: absolute;
      left: 8px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background-color: #00cdca;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .footer-icons {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .icon-box {
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .circle-1 { background: #001f3f; border-radius: 50%; }
    .square-2 { background: #00cdca; border-radius: 12px; }
    .circle-3 { background: #444444; border-radius: 50%; }
  </style>
</head>
<body>

  <div class="header">
    <svg width="40" height="40" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round">
      <path d="M 15 25 C 40 25, 55 15, 70 25 C 78 30, 75 42, 68 38 C 63 35, 66 28, 72 30" />
      <path d="M 15 50 C 40 50, 55 40, 70 50 C 78 55, 75 67, 68 63 C 63 60, 66 53, 72 55" />
      <path d="M 15 75 C 40 75, 55 65, 70 75 C 78 80, 75 92, 68 88 C 63 85, 66 78, 72 80" />
    </svg>
    <div class="logo-text">סופי</div>
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="input-container">
    <input type="text" id="userInput" class="chat-input" placeholder="דבר עם סופי..." onkeypress="handleKeyPress(event)" />
    <button class="send-btn" onclick="sendMessage()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

  <div class="footer-icons">
    <div class="icon-box circle-1"></div>
    <div class="icon-box square-2"></div>
    <div class="icon-box circle-3"></div>
  </div>

  <script>
    // כאן צריך להדביק את המפתח במקום המילים שבתוך הגרשיים
    const API_KEY = "AQ.Ab8RN6IQ0z1QpZNnoS-sX9zwYriesKMkLQJKnvW4XQT0wLowHg";

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const text = input.value.trim();

      if (text === "") return;

      const userDiv = document.createElement('div');
      userDiv.className = 'message user-message';
      userDiv.textContent = text;
      chatBox.appendChild(userDiv);

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message bot-message';
      loadingDiv.textContent = 'סופי חושבת...';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content) {
          const reply = data.candidates[0].content.parts[0].text;
          loadingDiv.textContent = reply;
        } else {
          loadingDiv.textContent = 'סליחה, לא הצלחתי לקבל מענה כרגע.';
        }
      } catch (error) {
        loadingDiv.textContent = 'שגיאה בהתחברות לשרת של סופי.';
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }
  </script>

</body>
</html>
