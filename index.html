<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סופי - SOFY AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rubik', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: radial-gradient(circle at left, #001f3f 0%, #00cdca 100%);
      color: white;
      padding: 30px 20px;
      overflow: hidden;
    }

    /* כותרת מועעמת */
    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 40px;
      opacity: 0.6;
    }

    .logo-text {
      font-size: 3rem;
      font-weight: 700;
      color: white;
    }

    /* שדה הקלט */
    .input-container {
      width: 100%;
      max-width: 550px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .chat-input {
      width: 100%;
      padding: 18px 25px;
      padding-left: 65px;
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: white;
      font-size: 1.15rem;
      outline: none;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
    }

    .chat-input::placeholder {
      color: rgba(255, 255, 255, 0.85);
    }

    .send-btn {
      position: absolute;
      left: 8px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background-color: #00cdca;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s;
    }

    .send-btn:hover {
      transform: scale(1.05);
    }

    /* אייקונים בתחתית */
    .footer-icons {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
    }

    .icon-box {
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }

    .circle-1 { background: #001f3f; border-radius: 50%; }
    .square-2 { background: #00cdca; border-radius: 15px; }
    .circle-3 { background: #444444; border-radius: 50%; }
  </style>
</head>
<body>

  <!-- כותרת בלוגו ספירלות -->
  <div class="header">
    <svg width="60" height="60" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round">
      <path d="M 15 25 C 40 25, 55 15, 70 25 C 78 30, 75 42, 68 38 C 63 35, 66 28, 72 30" />
      <path d="M 15 50 C 40 50, 55 40, 70 50 C 78 55, 75 67, 68 63 C 63 60, 66 53, 72 55" />
      <path d="M 15 75 C 40 75, 55 65, 70 75 C 78 80, 75 92, 68 88 C 63 85, 66 78, 72 80" />
    </svg>
    <div class="logo-text">סופי</div>
  </div>

  <!-- שדה כתיבה באמצע -->
  <div class="input-container">
    <input type="text" class="chat-input" placeholder="שלום סופי, אני כותב עכשיו..." />
    <button class="send-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

  <!-- סמלים בתחתית -->
  <div class="footer-icons">
    <div class="icon-box circle-1">
      <svg width="26" height="26" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="6" stroke-linecap="round">
        <path d="M 15 25 C 40 25, 55 15, 70 25 C 78 30, 75 42, 68 38 C 63 35, 66 28, 72 30" />
        <path d="M 15 50 C 40 50, 55 40, 70 50 C 78 55, 75 67, 68 63 C 63 60, 66 53, 72 55" />
        <path d="M 15 75 C 40 75, 55 65, 70 75 C 78 80, 75 92, 68 88 C 63 85, 66 78, 72 80" />
      </svg>
    </div>
    <div class="icon-box square-2">
      <svg width="26" height="26" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="6" stroke-linecap="round">
        <path d="M 15 25 C 40 25, 55 15, 70 25 C 78 30, 75 42, 68 38 C 63 35, 66 28, 72 30" />
        <path d="M 15 50 C 40 50, 55 40, 70 50 C 78 55, 75 67, 68 63 C 63 60, 66 53, 72 55" />
        <path d="M 15 75 C 40 75, 55 65, 70 75 C 78 80, 75 92, 68 88 C 63 85, 66 78, 72 80" />
      </svg>
    </div>
    <div class="icon-box circle-3">
      <svg width="26" height="26" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="6" stroke-linecap="round">
        <path d="M 15 25 C 40 25, 55 15, 70 25 C 78 30, 75 42, 68 38 C 63 35, 66 28, 72 30" />
        <path d="M 15 50 C 40 50, 55 40, 70 50 C 78 55, 75 67, 68 63 C 63 60, 66 53, 72 55" />
        <path d="M 15 75 C 40 75, 55 65, 70 75 C 78 80, 75 92, 68 88 C 63 85, 66 78, 72 80" />
      </svg>
    </div>
  </div>

</body>
</html>
